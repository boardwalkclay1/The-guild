<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guild Watchlist — Holding Companies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/guild/assets/css/guild-dashboard.css">
  <script src="watchlist-master.js" defer></script>

  <style>
    .watchlist-layout { display:grid; grid-template-columns:2fr 1fr; gap:20px; margin-top:20px; }
    .chart-block { background:rgba(0,0,0,0.6); border:1px solid #D4AF37; padding:15px; border-radius:12px; margin-bottom:25px; }
    .tools-panel { background:rgba(0,0,0,0.7); border:2px solid #D4AF37; padding:20px; border-radius:12px; position:sticky; top:20px; height:fit-content; }
    .tools-panel h2 { margin-top:0; text-align:center; letter-spacing:0.1em; }
    .tool-section { margin-bottom:20px; }
    .tool-section h3 { margin-bottom:8px; font-size:1.1rem; color:#D4AF37; }
    .tool-section ul { margin:0; padding-left:18px; line-height:1.5; }
  </style>
</head>

<body>

  <div class="dashboard-wrapper">

    <h1 class="section-title">Holding Companies Watchlist</h1>
    <p class="section-subtitle">Live charts + Guild Observatory Tools</p>

    <div class="watchlist-layout">

      <div id="chartColumn"></div>

      <div class="tools-panel">
        <h2>Guild Tools</h2>

        <div class="tool-section"><h3>Candlestick Patterns</h3><ul id="candlestickList"></ul></div>
        <div class="tool-section"><h3>Chart Patterns</h3><ul id="chartPatternList"></ul></div>
        <div class="tool-section"><h3>Trendline Guidance</h3><ul id="trendlineAdvice"></ul></div>
        <div class="tool-section"><h3>Guild Notes</h3><ul id="guildNotes"></ul></div>
      </div>

    </div>

  </div>

  <script>
    const tickers = ["BRK.B","BX","KKR","CG","APO","BAM","ARCC","MAIN","HTGC","OWL"];

    document.addEventListener("DOMContentLoaded", () => {
      const col = document.getElementById("chartColumn");
      tickers.forEach(symbol => {
        col.innerHTML += `
          <div class="chart-block">
            <h2>${symbol}</h2>
            <iframe src="https://s.tradingview.com/widgetembed/?symbol=${symbol}&interval=1h"
              style="width:100%;height:400px;border:none;border-radius:12px;" loading="lazy"></iframe>
          </div>`;
      });
    });
  </script>

</body>
</html>
