  <style>
    body { background:#000; color:#fff; margin:0; padding:20px; }

    .ticker-block {
      margin:40px 0;
      padding:20px;
      border:2px solid #D4AF37;
      border-radius:12px;
    }

    iframe { width:100%; border:none; }
    .chart { height:420px; }

    /* FLOATING TOP BUBBLE TOOL */
    .guild-tool-bubble {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 48px;
      height: 48px;
      background: #D4AF37;
      color: black;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }

    .guild-tools-panel {
      position: fixed;
      top: 75px;
      right: 15px;
      width: 300px;
      max-height: 80vh;
      overflow-y: auto;
      background: rgba(0,0,0,0.85);
      border: 2px solid #D4AF37;
      border-radius: 12px;
      padding: 15px;
      display: none;
      z-index: 9998;
    }

    .guild-tools-panel.open { display: block; }

    .guild-tools-panel h2 {
      text-align: center;
      color: #D4AF37;
      margin-top: 0;
    }

    .tool-section h3 { color:#D4AF37; margin-bottom:6px; }
    .tool-section ul { padding-left:18px; line-height:1.5; }
  </style>
</head>
