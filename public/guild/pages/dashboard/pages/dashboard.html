<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guild Market Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SOCIAL PREVIEW -->
  <meta property="og:title" content="Guild Market Terminal">
  <meta property="og:description" content="Your cinematic trading command center — charts, signals, gainers, losers, tools, and more.">
  <meta property="og:image" content="/assets/image/the-guild.png">
  <meta property="og:type" content="website">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Guild Market Terminal">
  <meta name="twitter:description" content="Your cinematic trading command center.">
  <meta name="twitter:image" content="/assets/image/the-guild.png">

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/assets/image/favicon.png">
  <link rel="apple-touch-icon" href="/assets/image/favicon.png">

  <!-- CSS -->
  <link rel="stylesheet" href="/guild/assets/css/guild-dashboard.css">

  <!-- JS -->
  <script src="/guild/pages/dashboard/js/guild-dashboard.js" defer></script>
  <script src="/guild/pages/dashboard/js/guild-ticker.js" defer></script>
  <script src="/guild/pages/dashboard/js/guild-timeframes.js" defer></script>
  <script src="/guild/pages/dashboard/js/guild-gainers.js" defer></script>
  <script src="/guild/pages/dashboard/js/guild-losers.js" defer></script>
  <script src="/guild/pages/dashboard/js/guild-data.js" defer></script>
  <script src="/guild/pages/dashboard/js/guild-signals.js" defer></script>
  <script src="/guild/pages/dashboard/js/guild-news.js" defer></script>

  <style>
    /* MOBILE‑SAFE BACKGROUND */
    body {
      background: url('/assets/image/the-guild.png') center center / cover no-repeat fixed;
      background-color: black;
    }

    /* NAV BAR */
    .guild-nav {
      width: 100%;
      background: rgba(0,0,0,0.75);
      border-bottom: 2px solid #D4AF37;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .guild-nav .nav-left {
      display: flex;
      gap: 18px;
    }

    .guild-nav a {
      color: #D4AF37;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: 0.2s;
      font-size: 0.95rem;
    }

    .guild-nav a:hover {
      color: white;
    }

    .guild-logo {
      height: 38px;
    }

    /* SLIMMER BUTTONS */
    .guild-card {
      padding: 10px 14px !important;
      font-size: 0.95rem !important;
      border-radius: 10px !important;
      min-height: 40px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.04em;
    }

    .card-grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important;
      gap: 14px !important;
    }
  </style>
</head>

<body>

  <!-- FULL NAVIGATION -->
  <div class="guild-nav">
    <div class="nav-left">
      <a href="/guild/index.html">Home</a>
      <a href="/guild/pages/dashboard/dashboard.html">Dashboard</a>
      <a href="/guild/pages/dashboard/pages/watchlist-full.html">Watchlist</a>
      <a href="/guild/pages/dashboard/pages/signals.html">Signals</a>
      <a href="/guild/pages/dashboard/pages/gainers.html">Gainers</a>
      <a href="/guild/pages/dashboard/pages/losers.html">Losers</a>
      <a href="/guild/pages/notes/notes-full.html">Notes</a>
      <a href="/guild/pages/training/training-progress.html">Training</a>
    </div>

    <img src="/assets/image/the-guild.png" class="guild-logo" alt="Guild Logo">
  </div>

  <!-- TICKER -->
  <div id="guildTicker" class="guild-ticker">
    <div id="guildTickerInner" class="guild-ticker-inner"></div>
  </div>

  <!-- MAIN WRAPPER -->
  <div class="dashboard-wrapper">

    <!-- QUICK ACTIONS -->
    <h2 class="section-title">Quick Actions</h2>
    <div class="card-grid">
      <div class="guild-card" onclick="go('/guild/pages/Gf/simulator.html')">Golden Formula</div>
      <div class="guild-card" onclick="go('/guild/pages/arena/arena-home.html')">Arena</div>
      <div class="guild-card" onclick="go('/guild/pages/dashboard/pages/signals.html')">Signals</div>

      <!-- FIXED WATCHLIST PATH -->
      <div class="guild-card" onclick="go('/guild/pages/dashboard/pages/watchlist-full.html')">Watchlist</div>

      <div class="guild-card" onclick="go('/guild/pages/notes/notes-full.html')">Notes</div>
      <div class="guild-card" onclick="go('/guild/pages/training/training-progress.html')">Training</div>
    </div>

    <!-- MARKET SNAPSHOTS -->
    <h2 class="section-title">Market Snapshots</h2>
    <div class="card-grid">
      <div class="guild-card" onclick="go('/guild/pages/dashboard/pages/gainers.html')">Biggest Gainers</div>
      <div class="guild-card" onclick="go('/guild/pages/dashboard/pages/losers.html')">Biggest Losers</div>
    </div>

    <!-- HIGH / LOW PANEL -->
    <h2 class="section-title">Highs & Lows</h2>
    <div id="highLowPanel" class="info-panel"></div>

    <!-- MULTI-TIMEFRAME VIEWER -->
    <h2 class="section-title">Multi‑Timeframe Viewer</h2>
    <button class="add-tf-btn" onclick="addTimeframe()">+ Add Timeframe</button>
    <div id="timeframeGrid" class="timeframe-grid"></div>

    <!-- GUILD METER -->
    <h2 class="section-title">Guild Rank</h2>
    <div id="guildMeter" class="guild-meter">
      <div id="guildMeterFill" class="guild-meter-fill"></div>
    </div>
    <div id="guildRankLabel" class="guild-rank-label"></div>

  </div>

</body>
</html>
