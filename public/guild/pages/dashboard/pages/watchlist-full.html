<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guild Watchlist — Full View</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Guild Styles -->
  <link rel="stylesheet" href="/guild/assets/css/guild-dashboard.css">

  <!-- Master Tools JS -->
  <script src="/guild/pages/dashboard/lab/js/lab.js" defer></script>

  <style>
    body {
      background: url('/assets/image/the-guild.png') center center / cover no-repeat fixed;
      margin: 0;
      padding: 0;
    }

    .dashboard-wrapper {
      padding: 20px;
    }

    /* HEADER */
    .fullpage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .back-btn {
      background: #D4AF37;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
    }

    /* SECTOR DROPDOWN */
    .sector-dropdown {
      background: rgba(0,0,0,0.7);
      border: 2px solid #D4AF37;
      padding: 12px;
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      width: 100%;
      margin-bottom: 20px;
    }

    /* FLOATING TOOLS PANEL (collapsed by default) */
    .tools-floating {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      border: 2px solid #D4AF37;
      border-radius: 12px;
      padding: 12px;
      width: 220px;
      cursor: pointer;
      transition: 0.25s;
      z-index: 999;
    }

    .tools-floating h3 {
      margin: 0;
      font-size: 1rem;
      color: #D4AF37;
      text-align: center;
    }

    .tools-expanded {
      height: auto;
      max-height: 80vh;
      overflow-y: auto;
      padding: 16px;
    }

    .tools-collapsed {
      height: 40px;
      overflow: hidden;
    }

    .tool-section {
      margin-bottom: 18px;
    }

    .tool-section h4 {
      color: #D4AF37;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .tool-section ul {
      padding-left: 18px;
      line-height: 1.5;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="dashboard-wrapper">

    <!-- HEADER -->
    <div class="fullpage-header">
      <h1>Guild Watchlist — Full View</h1>
      <button onclick="history.back()" class="back-btn">← Back</button>
    </div>

    <!-- SECTOR DROPDOWN -->
    <select class="sector-dropdown" onchange="go(this.value)">
      <option value="">Select a Sector…</option>

      <option value="watchlist/tech.html">Tech</option>
      <option value="watchlist/bitcoin.html">Bitcoin / Crypto</option>
      <option value="watchlist/gas.html">Oil & Gas</option>
      <option value="watchlist/ai.html">AI</option>
      <option value="watchlist/holdings.html">Holding Companies</option>

      <option value="watchlist/banking.html">Banking</option>
      <option value="watchlist/airlines.html">Airlines</option>
      <option value="watchlist/energy.html">Energy</option>
      <option value="watchlist/semiconductors.html">Semiconductors</option>
      <option value="watchlist/retail.html">Retail</option>

      <option value="watchlist/healthcare.html">Healthcare</option>
      <option value="watchlist/defense.html">Defense</option>
      <option value="watchlist/realestate.html">Real Estate</option>
      <option value="watchlist/metals.html">Metals & Mining</option>
      <option value="watchlist/utilities.html">Utilities</option>
    </select>

  </div>

  <!-- FLOATING TOOLS PANEL -->
  <div id="toolsPanel" class="tools-floating tools-collapsed" onclick="toggleTools()">
    <h3>Guild Tools</h3>

    <div id="toolsContent" style="display:none;">

      <div class="tool-section">
        <h4>Candlestick Patterns</h4>
        <ul id="candlestickList"></ul>
      </div>

      <div class="tool-section">
        <h4>Chart Patterns</h4>
        <ul id="chartPatternList"></ul>
      </div>

      <div class="tool-section">
        <h4>Trendline Guidance</h4>
        <ul id="trendlineAdvice"></ul>
      </div>

      <div class="tool-section">
        <h4>Guild Notes</h4>
        <ul id="guildNotes"></ul>
      </div>

    </div>
  </div>

  <script>
    function go(page) {
      if (page) window.location.href = page;
    }

    function toggleTools() {
      const panel = document.getElementById("toolsPanel");
      const content = document.getElementById("toolsContent");

      if (panel.classList.contains("tools-collapsed")) {
        panel.classList.remove("tools-collapsed");
        panel.classList.add("tools-expanded");
        content.style.display = "block";
      } else {
        panel.classList.add("tools-collapsed");
        panel.classList.remove("tools-expanded");
        content.style.display = "none";
      }
    }
  </script>

</body>
</html>
