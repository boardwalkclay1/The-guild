<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Even Number Strike Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/assets/image/the-guild.png" />
  <link rel="apple-touch-icon" href="/assets/image/the-guild.png" />

  <!-- GLOBAL CSS -->
  <link rel="stylesheet" href="/guild/assets/css/guild-style.css" />

  <style>
    body {
      background: #000;
      font-family: system-ui, sans-serif;
      padding: 40px 20px;
      color: #D4AF37;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 10%, rgba(212,175,55,0.18), transparent 70%);
      opacity: 0.4;
      z-index: -1;
    }

    .sim-shell {
      max-width: 800px;
      margin: 0 auto;
      background: rgba(0,0,0,0.8);
      border-radius: 18px;
      border: 2px solid #D4AF37;
      padding: 24px;
      box-shadow: 0 0 25px rgba(212,175,55,0.4);
    }

    h1 {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .sim-sub {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .price-row {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .price-box {
      min-width: 140px;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #8B6B2C;
    }

    .price-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.8;
      margin-bottom: 4px;
    }

    .price-value {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .status {
      margin-top: 16px;
      font-size: 0.95rem;
      min-height: 1.4em;
    }

    .timer {
      margin-top: 10px;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .btn-row {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .sim-btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 0.85rem;
      background: #D4AF37;
      color: #000;
      transition: 0.2s ease;
    }

    .sim-btn[disabled] {
      opacity: 0.4;
      cursor: default;
    }

    .sim-btn:hover:not([disabled]) {
      background: #8B6B2C;
      color: #fff;
    }

    .xp-banner {
      margin-top: 20px;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .back-link {
      display: block;
      margin-top: 30px;
      color: #D4AF37;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .back-link:hover {
      color: #fff;
    }
  </style>
</head>

<body class="fade-in">

  <div class="sim-shell">
    <h1>Even Number Strike</h1>
    <div class="sim-sub">
      Enter at <strong>$10.00</strong> as price falls from <strong>$10.20</strong>.  
      Exit at <strong>$10.50</strong> after the bounce.  
      You have a 20 second window at the top.
    </div>

    <div class="price-row">
      <div class="price-box">
        <div class="price-label">Current Price</div>
        <div class="price-value" id="priceDisplay">$10.20</div>
      </div>

      <div class="price-box">
        <div class="price-label">Phase</div>
        <div class="price-value" id="phaseDisplay">Waiting for Entry</div>
      </div>

      <div class="price-box">
        <div class="price-label">Timer</div>
        <div class="price-value" id="timerDisplay">--</div>
      </div>
    </div>

    <div class="status" id="statusText">
      Wait for price to touch <strong>$10.00</strong> on the way down, then hit ENTER.
    </div>

    <div class="btn-row">
      <button class="sim-btn" id="enterBtn" disabled>Enter at $10.00</button>
      <button class="sim-btn" id="exitBtn" disabled>Exit at $10.50</button>
      <button class="sim-btn" id="restartBtn">Restart</button>
    </div>

    <div class="xp-banner" id="xpBanner"></div>
  </div>

  <a class="back-link" href="/guild/pages/even-numbers.html">← Back to Even Numbers</a>

  <!-- XP + BADGES -->
  <script src="/guild/xp/xp.js"></script>
  <script src="/guild/xp/badges.js"></script>

  <!-- SIM LOGIC -->
  <script src="/guild/training/js/even-number-sim.js"></script>

</body>
</html>
