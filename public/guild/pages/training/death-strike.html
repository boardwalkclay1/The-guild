<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DEATH STRIKE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- FAVICON + PWA -->
  <link rel="icon" type="image/png" href="/guild/assets/image/the-guild.png">
  <link rel="apple-touch-icon" href="/guild/assets/image/the-guild.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- Guild CSS -->
  <link rel="stylesheet" href="/guild/assets/css/guild-style.css" />

  <!-- XP + BADGES -->
  <script src="/guild/xp/xp.js"></script>
  <script src="/guild/xp/badges.js"></script>

  <!-- DEATH STRIKE JS -->
  <script src="/guild/assets/js/death-strike.js" defer></script>

  <style>
    body {
      background: #000;
      font-family: 'Uncial Antiqua', serif;
      padding: 40px 20px;
      line-height: 1.65;
      color: #D4AF37;
      text-align: center;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("/guild/assets/image/coolguild.jpg") center/cover no-repeat;
      opacity: 0.22;
      z-index: -1;
      filter: grayscale(30%);
    }

    .ds-wrapper {
      max-width: 1200px;
      margin: 40px auto 80px;
      background: rgba(0,0,0,0.82);
      border: 2px solid #D4AF37;
      border-radius: 18px;
      box-shadow: 0 0 25px rgba(212,175,55,0.35);
      display: flex;
      overflow: hidden;
    }

    .ds-menu {
      width: 260px;
      border-right: 2px solid #8B6B2C;
      padding: 24px 18px;
      background: rgba(0,0,0,0.85);
      text-align: left;
    }

    .ds-menu-title {
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 1rem;
      margin-bottom: 18px;
    }

    .ds-menu-item {
      padding: 10px 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #D4AF37;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.85rem;
      transition: 0.25s ease;
    }

    .ds-menu-item:hover,
    .ds-menu-item.active {
      background: rgba(212,175,55,0.25);
      text-shadow: 0 0 10px #D4AF37;
    }

    .ds-panel {
      flex: 1;
      padding: 32px 40px;
      text-align: left;
      max-height: 80vh;
      overflow-y: auto;
    }

    h1.ds-title {
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .ds-subtitle {
      text-align: center;
      opacity: 0.9;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 28px;
      margin-bottom: 10px;
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    p {
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      opacity: 0.95;
      margin-bottom: 14px;
    }

    .example-box {
      border: 1px solid #8B6B2C;
      border-radius: 12px;
      padding: 14px 16px;
      margin: 10px 0;
      background: rgba(0,0,0,0.7);
    }

    .ds-callout {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #D4AF37;
      background: rgba(0,0,0,0.7);
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }

    .ds-btn {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 20px;
      background: #D4AF37;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 10px;
      transition: 0.25s ease;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .ds-btn:hover {
      background: #8B6B2C;
      color: #fff;
    }

    .ds-btn-ghost {
      background: transparent;
      border: 1px solid #D4AF37;
      color: #D4AF37;
    }

    .ds-btn-ghost:hover {
      background: rgba(212,175,55,0.2);
      color: #fff;
    }

    /* XP BOX */
    .xp-box {
      margin: 0 auto 20px;
      padding: 10px 14px;
      max-width: 420px;
      background: rgba(0,0,0,0.65);
      border: 1px solid #8B6B2C;
      border-radius: 12px;
      text-align: center;
      font-size: 0.9rem;
      color: #D4AF37;
      font-family: system-ui, sans-serif;
    }

    .badge-earned {
      margin-top: 8px;
      padding: 6px 10px;
      display: inline-block;
      background: #D4AF37;
      color: #000;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    /* QUIZ */
    .ds-quiz-q {
      margin-bottom: 12px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
    }

    .ds-quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ds-quiz-opt {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #8B6B2C;
      background: rgba(0,0,0,0.7);
      color: #D4AF37;
      cursor: pointer;
      font-size: 0.9rem;
      text-align: left;
      transition: 0.2s ease;
    }

    .ds-quiz-opt:hover {
      background: rgba(212,175,55,0.18);
    }

    .ds-quiz-progress {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .ds-quiz-result {
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .ds-arena-levels {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ds-arena-note {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.9;
      font-family: system-ui, sans-serif;
    }

    .back-link {
      display: block;
      margin: 30px auto 0;
      color: #D4AF37;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
    }

    .back-link:hover {
      color: #fff;
      text-shadow: 0 0 10px #D4AF37;
    }
  </style>
</head>

<body class="fade-in">

  <h1 class="ds-title">DEATH STRIKE</h1>
  <p class="ds-subtitle">The final teaching scroll before you enter the Arena.</p>

  <!-- XP + BADGE STATUS -->
  <div class="xp-box">
    <div id="xpDisplay">XP: 0</div>
    <div id="badgeDisplay"></div>
  </div>

  <div class="ds-wrapper">

    <!-- LEFT MENU -->
    <div class="ds-menu">
      <div class="ds-menu-title">Death Strike Module</div>

      <div class="ds-menu-item active" data-section="info">Death Strike Knowledge</div>
      <div class="ds-menu-item" data-section="quiz">Death Strike Quiz</div>
      <div class="ds-menu-item" data-section="arena">Arena Tower</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="ds-panel" id="dsPanel">
      <!-- JS will inject content here -->
    </div>

  </div>

  <a class="back-link" onclick="window.location.href='/guild/pages/inside-the-guild.html'">
    ← Return to the Inner Hall
  </a>

</body>
</html>
