<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guild Discipline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- FAVICON + PWA -->
  <link rel="icon" type="image/png" href="/assets/image/the-guild.png">
  <link rel="apple-touch-icon" href="/assets/image/the-guild.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- GLOBAL CSS -->
  <link rel="stylesheet" href="/guild/assets/css/guild-style.css" />

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Uncial+Antiqua&display=swap" rel="stylesheet">

  <!-- DISCIPLINE JS -->
  <script src="/guild/assets/js/discipline.js" defer></script>

  <style>
    body {
      background: url('/assets/image/guild-toon-fight.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      color: #D4AF37;
      font-family: system-ui, sans-serif;
    }

    .discipline-wrapper {
      display: flex;
      max-width: 1300px;
      margin: 140px auto 100px;
      background: rgba(0,0,0,0.65);
      border: 2px solid #D4AF37;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(212,175,55,0.25);
      backdrop-filter: blur(3px);
      overflow: hidden;
    }

    /* LEFT MENU */
    .discipline-menu {
      width: 280px;
      border-right: 2px solid #8B6B2C;
      padding: 20px;
      background: rgba(0,0,0,0.55);
    }

    .menu-title {
      font-family: "Uncial Antiqua", serif;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .discipline-item {
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid #D4AF37;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.9rem;
      transition: 0.25s ease;
    }

    .discipline-item:hover,
    .discipline-item.active {
      background: rgba(212,175,55,0.25);
      text-shadow: 0 0 10px #D4AF37;
    }

    /* RIGHT CONTENT PANEL */
    .discipline-content {
      flex: 1;
      padding: 40px 50px;
      overflow-y: auto;
      max-height: 80vh;
    }

    h1 {
      font-family: "Uncial Antiqua", serif;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 2rem;
      margin-bottom: 20px;
      text-align: center;
    }

    h2 {
      font-family: "Cinzel", serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 40px;
      margin-bottom: 12px;
      font-size: 1.4rem;
    }

    p {
      max-width: 780px;
      margin-bottom: 18px;
      font-size: 1.05rem;
      opacity: 0.92;
    }

    .divider {
      width: 80%;
      max-width: 520px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #D4AF37, transparent);
      margin: 35px 0;
      opacity: 0.7;
    }

    .back {
      display: block;
      margin-top: 40px;
      color: #D4AF37;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      text-align: center;
      transition: 0.3s ease;
      cursor: pointer;
    }

    .back:hover {
      color: #fff;
      text-shadow: 0 0 10px #D4AF37;
    }
  </style>
</head>

<body>

  <div class="discipline-wrapper">

    <!-- LEFT MENU -->
    <div class="discipline-menu">
      <div class="menu-title">Discipline Pillars</div>

      <div class="discipline-item" data-discipline="physical">Physical Discipline</div>
      <div class="discipline-item" data-discipline="emotional">Emotional Discipline</div>
      <div class="discipline-item" data-discipline="strategic">Strategic Discipline</div>
      <div class="discipline-item" data-discipline="lifestyle">Lifestyle Discipline</div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="discipline-content" id="disciplineContent">
      <h1>The Discipline Doctrine</h1>
      <p>Select a discipline on the left to begin.</p>
    </div>

  </div>

  <a class="back" onclick="window.location.href='/guild/pages/guild.html'">← Return to the Inner Hall</a>

</body>
</html>
