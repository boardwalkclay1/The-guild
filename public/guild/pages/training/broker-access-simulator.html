<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Broker Access Simulator – Guild Training Simulation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/guild/assets/css/guild-style.css">
<script defer src="/guild/assets/js/broker-access.js"></script>

<style>
body {
  background: #000;
  color: #e6c37f;
  font-family: 'Cinzel', serif;
  margin: 0;
  padding: 0;
}

.training-container {
  width: 92%;
  max-width: 850px;
  margin: 0 auto;
  padding: 40px 0;
}

h1, h2 {
  text-align: center;
  letter-spacing: 0.05em;
  margin-bottom: 20px;
}

.broker-select-box {
  background: rgba(20,20,20,0.85);
  border: 1px solid #e6c37f;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 30px;
  text-align: center;
}

.broker-btn {
  display: inline-block;
  background: rgba(40,40,40,0.9);
  border: 1px solid #e6c37f;
  border-radius: 14px;
  padding: 14px 20px;
  margin: 12px;
  text-decoration: none;
  color: #e6c37f;
  cursor: pointer;
  transition: 0.2s;
}

.broker-btn:hover {
  background: rgba(230,195,127,0.15);
}

.simulator-box {
  background: rgba(20,20,20,0.85);
  border: 1px solid #e6c37f;
  border-radius: 16px;
  padding: 22px;
  margin-top: 25px;
}

.progress-bar {
  width: 100%;
  height: 14px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  margin: 20px 0;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #e6c37f;
  transition: width 0.4s ease;
}

.sim-screen {
  background: rgba(0,0,0,0.6);
  border: 1px solid #e6c37f;
  border-radius: 14px;
  padding: 20px;
  margin-top: 20px;
}

.sim-option {
  background: rgba(40,40,40,0.9);
  border: 1px solid #e6c37f;
  border-radius: 12px;
  padding: 12px;
  margin: 10px 0;
  cursor: pointer;
  transition: 0.2s;
}

.sim-option:hover {
  background: rgba(230,195,127,0.15);
}

.feedback {
  margin-top: 15px;
  font-size: 0.95rem;
  opacity: 0.85;
}

.success-badge {
  margin-top: 20px;
  padding: 12px 18px;
  background: #e6c37f;
  color: #000;
  border-radius: 10px;
  font-weight: bold;
  text-align: center;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.retry-btn {
  margin-top: 20px;
  padding: 12px 18px;
  background: rgba(40,40,40,0.9);
  border: 1px solid #e6c37f;
  border-radius: 10px;
  color: #e6c37f;
  cursor: pointer;
  text-align: center;
  display: inline-block;
}

.retry-btn:hover {
  background: rgba(230,195,127,0.15);
}
</style>
</head>

<body>

<div class="training-container">
  <h1>Broker Access Simulator</h1>
  <p style="text-align:center; opacity:0.8;">
    This is a <strong>Guild Training Simulation</strong>.  
    You will click through each broker’s interface as if you were unlocking options trading in real life.
  </p>

  <div class="broker-select-box">
    <h2>Select a Broker</h2>
    <a class="broker-btn" onclick="startSim('Chase')">Chase</a>
    <a class="broker-btn" onclick="startSim('Webull')">Webull</a>
    <a class="broker-btn" onclick="startSim('Robinhood')">Robinhood</a>
    <a class="broker-btn" onclick="startSim('TD')">TD Ameritrade</a>
  </div>

  <div id="simulatorArea"></div>
</div>

</body>
</html>
