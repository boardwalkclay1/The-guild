<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guild Signal Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/assets/image/the-guild.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="/guild/assets/css/guild-style.css" />

  <!-- SIGNAL ENGINE -->
  <script src="/guild/assets/js/guild-signals.js" defer></script>

  <style>
    body {
      background: #000;
      color: #D4AF37;
      font-family: system-ui, sans-serif;
      padding: 40px 20px;
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("/assets/image/Arcadium.jpg") center/cover no-repeat;
      opacity: 0.22;
      z-index: -1;
    }

    .signal-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      background: rgba(0,0,0,0.75);
      border: 2px solid #D4AF37;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(212,175,55,0.3);
    }

    h1 {
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 20px;
      font-family: "Uncial Antiqua", serif;
    }

    .input-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #8B6B2C;
      background: rgba(0,0,0,0.6);
      color: #D4AF37;
      width: 200px;
      text-align: center;
    }

    .signal-btn {
      padding: 12px 20px;
      background: #D4AF37;
      color: #000;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      transition: 0.25s ease;
    }

    .signal-btn:hover {
      background: #8B6B2C;
      color: #fff;
    }

    .signal-box {
      margin-top: 30px;
      padding: 20px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #8B6B2C;
      border-radius: 12px;
      text-align: left;
    }

    .signal-title {
      font-size: 1.2rem;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .signal-item {
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>

  <div class="signal-wrapper">
    <h1>Guild Signal Engine</h1>

    <p>Enter a ticker to generate Guild‑style signals using free APIs.</p>

    <div class="input-row">
      <input id="tickerInput" placeholder="AAPL, TSLA, SPY..." />
      <div class="signal-btn" onclick="runGuildSignals()">Generate Signals</div>
    </div>

    <div id="signalOutput" class="signal-box" style="display:none;"></div>
  </div>

</body>
</html>
