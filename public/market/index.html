<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guild Market Terminal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Guild Style -->
  <link rel="stylesheet" href="/guild/assets/css/guild-style.css">

  <style>
    body {
      background:#000 url('/assets/image/guild-win.jpg') center/cover fixed no-repeat;
      color:#fff;
      margin:0;
      padding:0;
      font-family: 'Marcellus SC', serif;
    }

    .market-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align:center;
      font-size: 42px;
      margin-bottom: 40px;
      color:#D4AF37;
      text-shadow: 0 0 10px #000;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .category-card {
      background: rgba(0,0,0,0.65);
      border: 2px solid #D4AF37;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      cursor: pointer;
      transition: 0.2s;
    }

    .category-card:hover {
      background: rgba(212,175,55,0.2);
      transform: scale(1.03);
    }

    .back-btn {
      display:inline-block;
      margin-bottom:20px;
    }
  </style>
</head>

<body class="fade-in">

<div class="market-container">

  <a href="/index.html" class="guild-btn back-btn">← Back to Guild Home</a>

  <h1>📈 Guild Market Terminal</h1>

  <div class="category-grid">

    <div class="category-card" onclick="go('/market/tech.html')">
      ⚙️ Tech Stocks
    </div>

    <div class="category-card" onclick="go('/market/bitcoin.html')">
      ₿ Bitcoin‑Linked Stocks
    </div>

    <div class="category-card" onclick="go('/market/airlines.html')">
      ✈️ Airline Stocks
    </div>

    <div class="category-card" onclick="go('/market/oil.html')">
      🛢️ Oil & Energy Stocks
    </div>

    <div class="category-card" onclick="go('/market/automotive.html')">
      🚗 Automotive Stocks
    </div>

    <div class="category-card" onclick="go('/market/military.html')">
      🛡️ Military & Defense Stocks
    </div>

    <div class="category-card" onclick="go('/market/schools.html')">
      🎓 Education Stocks
    </div>

    <div class="category-card" onclick="go('/market/retail.html')">
      🛍️ Retail Stocks
    </div>

    <div class="category-card" onclick="go('/market/banks.html')">
      💰 Banking & Financial Stocks
    </div>

    <div class="category-card" onclick="go('/market/ev.html')">
      🔋 EV & Clean Energy Stocks
    </div>

  </div>

</div>

<script>
  function go(path) {
    window.location.href = path;
  }
</script>

</body>
</html>
