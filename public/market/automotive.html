  <link rel="stylesheet" href="/guild/assets/css/guild-style.css">
  <style>
    body { background:#000; color:#fff; margin:0; padding:0; }

    .ticker-block {
      margin:40px 0;
      padding:20px;
      border:2px solid #D4AF37;
      border-radius:12px;
    }

    .scroll-wrap {
      display:flex;
      overflow-x:auto;
      gap:20px;
      padding-bottom:10px;
    }

    .chart-box, .options-box {
      min-width:600px;
      border-radius:10px;
      overflow:hidden;
    }

    iframe {
      width:100%;
      height:500px;
      border:none;
    }

    .back {
      margin:20px 0;
      display:inline-block;
    }
  </style>
</head>
