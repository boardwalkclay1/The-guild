<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta property="og:title" content="Retail – Guild Market">

  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="/guild/assets/css/guild-style.css">

  <style>
    body { background:#000; color:#fff; margin:0; padding:20px; }
    .ticker-block { margin:40px 0; padding:20px; border:2px solid #D4AF37; border-radius:12px; }
    iframe { width:100%; border:none; }
    .chart { height:400px; }
    .guild-tool-bubble { position:fixed; top:15px; right:15px; width:48px; height:48px; background:#D4AF37; color:black; border-radius:50%; display:flex; justify-content:center; align-items:center; font-size:22px; font-weight:bold; cursor:pointer; z-index:9999; box-shadow:0 0 12px rgba(0,0,0,0.6); }
    .guild-tools-panel { position:fixed; top:75px; right:15px; width:300px; max-height:80vh; overflow-y:auto; background:rgba(0,0,0,0.85); border:2px solid #D4AF37; border-radius:12px; padding:15px; display:none; z-index:9998; }
    .guild-tools-panel.open { display:block; }
    .guild-tools-panel h2 { text-align:center; color:#D4AF37; margin-top:0; }
    .tool-section h3 { color:#D4AF37; margin-bottom:6px; }
    .tool-section ul { padding-left:18px; line-height:1.5; }
  </style>
</head>

<body>

<a href="/guild/pages/dashboard/pages/watchlist-full.html" class="guild-btn">← Back</a>
<h1 class="guild-title">Retail</h1>

<div class="ticker-block"><h2>WMT</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=WMT&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>TGT</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=TGT&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>COST</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=COST&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>HD</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=HD&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>LOW</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=LOW&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>AMZN</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=AMZN&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>BBY</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=BBY&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>M</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=M&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>ROST</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=ROST&interval=15&theme=dark"></iframe></div>
<div class="ticker-block"><h2>TJX</h2><iframe class="chart" src="https://s.tradingview.com/widgetembed/?symbol=TJX&interval=15&theme=dark"></iframe></div>

<div id="guildToolBubble" class="guild-tool-bubble" onclick="toggleGuildTools()">☰</div>
<div id="guildToolsPanel" class="guild-tools-panel">
  <h2>Guild Tools</h2>
  <div class="tool-section"><h3>Candlestick Patterns</h3><ul id="candlestickList"></ul></div>
  <div class="tool-section"><h3>Chart Patterns</h3><ul id="chartPatternList"></ul></div>
  <div class="tool-section"><h3>Trendline Guidance</h3><ul id="trendlineAdvice"></ul></div>
  <div class="tool-section"><h3>Guild Notes</h3><ul id="guildNotes"></ul></div>
</div>

<script src="js/watchlist-master.js" defer></script>
<script>function toggleGuildTools(){document.getElementById("guildToolsPanel").classList.toggle("open");}</script>

</body>
</html>
