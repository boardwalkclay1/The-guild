<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Guild</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="/assets/image/the-guild.png" />
  <link rel="apple-touch-icon" href="/assets/image/the-guild.png" />

  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Marcellus+SC&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/index.css">

  <style>
    /* FIX THE BACKGROUND — keep position, extend height */
    body {
      background:url('/assets/image/guild-win.jpg') center top no-repeat fixed;
      background-size: 100% auto; /* keeps width perfect, extends height */
      margin:0;
      padding:0;
    }

    /* Add bottom fade so the image looks naturally longer */
    body::after {
      content:"";
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      height:300px; /* extend more or less if needed */
      background:linear-gradient(to bottom, transparent, #000);
      pointer-events:none;
      z-index:-1;
    }

    /* Black transparent block behind quick links */
    .quick-links {
      background: rgba(0,0,0,0.65);
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <nav class="top-nav">
    <a onclick="go('/pages/colosseum.html')">The Colosseum</a>
    <a onclick="go('/pages/guild-entry.html')">Inner Hall</a>
    <a onclick="go('/pages/second-thoughts.html')">Why Join the Guild</a>
    <a onclick="go('/guild/pages/arena/guild-live-terms-of-service.html')">Terms of Service</a>
    <a onclick="go('/guild/pages/arena/guild-live-privacy-agreement.html')">Privacy Policy</a>
  </nav>

  <header class="guild-header">
    <h1 class="guild-title">The Guild Brotherhood &amp; Sisterhood</h1>
  </header>

  <section class="login-panel">
    <h2 class="panel-title">Member Login</h2>

    <input id="loginUser" type="text" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">

    <button class="login-btn" onclick="login()">Enter the Guild</button>

    <p class="new-here">
      New to the Guild?<br>
      <a onclick="go('/pages/guild-entry.html')">Enter the Inner Hall</a>
    </p>
  </section>

  <!-- BLACK TRANSPARENT BLOCK ADDED HERE -->
  <section class="quick-links">
    <button class="login-btn" onclick="go('/pages/colosseum.html')">🏛️ The Colosseum</button>
    <button class="login-btn" onclick="go('/pages/guild-entry.html')">🜁 Inner Hall</button>
    <button class="login-btn" onclick="go('/pages/second-thoughts.html')">✨ Why Join the Guild</button>

    <!-- MARKET TERMINAL BUTTON (KEEP THIS) -->
    <button class="login-btn" onclick="go('/market/index.html')">📈 Guild Market Terminal</button>

    <!-- LEGAL BUTTONS -->
    <button class="login-btn" onclick="go('/guild/pages/arena/guild-live-terms-of-service.html')">📜 Terms of Service</button>
    <button class="login-btn" onclick="go('/guild/pages/arena/guild-live-privacy-agreement.html')">🔒 Privacy Policy</button>
  </section>

  <script src="/assets/js/index.js" defer></script>

</body>
</html>
