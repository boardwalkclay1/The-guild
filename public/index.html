<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Guild</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" href="/assets/image/the-guild.png" />
  <link rel="apple-touch-icon" href="/assets/image/the-guild.png" />

  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Marcellus+SC&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/index.css">

  <style>
    /* FULL IMAGE — NEVER CUT OFF */
    body {
      background: url('/assets/image/guild-win.jpg') top center no-repeat fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      position: relative;
      min-height: 100vh;
    }

    /* SMOOTH BOTTOM FADE */
    body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 350px;
      background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,1));
      pointer-events: none;
      z-index: 0;
    }

    nav, header, section {
      position: relative;
      z-index: 2;
    }

    /* BLACK TRANSPARENT BLOCK BEHIND QUICK LINKS */
    .quick-links {
      background: rgba(0,0,0,0.55);
      padding: 22px;
      border-radius: 14px;
      margin-top: 40px;
      backdrop-filter: blur(4px);
    }

    /* ============================
       GUILD LOADING SCREEN
    ============================ */
    #guild-loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(0,0,0,0.9), rgba(0,0,0,1));
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: loaderFadeIn 0.4s ease-out forwards;
    }

    .guild-sigil {
      font-size: 110px;
      color: gold;
      text-shadow: 0 0 25px rgba(255,215,0,0.9);
      animation: sigilPulse 1.2s infinite ease-in-out;
    }

    .guild-loading-text {
      margin-top: 20px;
      font-family: 'Marcellus SC', serif;
      font-size: 24px;
      color: #e8d9a8;
      text-shadow: 0 0 12px rgba(0,0,0,0.8);
      letter-spacing: 1px;
    }

    @keyframes sigilPulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes loaderFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .fade-out {
      animation: loaderFadeOut 0.8s forwards ease-out;
    }

    @keyframes loaderFadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- ============================
       GUILD LOADING SCREEN
  ============================ -->
  <div id="guild-loader">
    <div class="guild-sigil">⚡</div>
    <div class="guild-loading-text">Entering the Guild...</div>
  </div>

  <nav class="top-nav">
    <a onclick="go('/rules-of-engagement.html')">R.O.E</a>
    <a onclick="go('/pages/colosseum.html')">The Colosseum</a>
    <a onclick="go('/pages/guild-entry.html')">Inner Hall</a>
    <a onclick="go('/pages/second-thoughts.html')">Why Join the Guild</a>
    <a onclick="go('/guild/pages/arena/guild-live-terms-of-service.html')">Terms of Service</a>
    <a onclick="go('/guild/pages/arena/guild-live-privacy-agreement.html')">Privacy Policy</a>
  </nav>

  <header class="guild-header">
    <h1 class="guild-title">The Guild Brotherhood &amp; Sisterhood</h1>
  </header>

  <section class="login-panel">
    <h2 class="panel-title">Member Login</h2>

    <input id="loginUser" type="text" placeholder="Username">
    <input id="loginPass" type="password" placeholder="Password">

    <button class="login-btn" onclick="login()">Enter the Guild</button>

    <p class="new-here">
      New to the Guild?<br>
      <a onclick="go('/pages/guild-entry.html')">Enter the Inner Hall</a>
    </p>
  </section>

  <section class="quick-links">
    <button class="login-btn" onclick="go('/pages/colosseum.html')">🏛️ The Colosseum</button>
    <button class="login-btn" onclick="go('/pages/guild-entry.html')">🜁 Inner Hall</button>
    <button class="login-btn" onclick="go('/pages/second-thoughts.html')">✨ Why Join the Guild</button>

    <button class="login-btn" onclick="go('/market/index.html')">📈 Guild Market Terminal</button>

    <button class="login-btn" onclick="go('/guild/pages/arena/guild-live-terms-of-service.html')">📜 Terms of Service</button>
    <button class="login-btn" onclick="go('/guild/pages/arena/guild-live-privacy-agreement.html')">🔒 Privacy Policy</button>
  </section>

  <script src="/assets/js/index.js" defer></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loader = document.getElementById("guild-loader");
      setTimeout(() => {
        loader.classList.add("fade-out");
        setTimeout(() => loader.remove(), 800);
      }, 1200);
    });
  </script>

</body>
</html>
